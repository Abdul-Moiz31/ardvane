<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PolinRider Guard</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <div class="brand">
        <img src="/icon.png" alt="" width="28" height="28">
        <div>
          <div class="brand-name" data-app-name>PolinRider Guard</div>
          <div class="brand-sub">Runs on this computer only</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#overview" data-page="overview"><span data-icon="home"></span>Overview</a>
        <a href="#todo" data-page="todo"><span data-icon="checkCircle"></span>To-do<span class="nav-count" id="nav-todo-count" hidden></span></a>
        <a href="#scan" data-page="scan"><span data-icon="radar"></span>Scan<span class="nav-dot" id="nav-scan-dot" hidden></span></a>
        <a href="#protection" data-page="protection"><span data-icon="shield"></span>Protection</a>
        <a href="#reports" data-page="reports"><span data-icon="file"></span>Reports</a>
        <a href="#learn" data-page="learn"><span data-icon="book"></span>Learn</a>
        <a href="#settings" data-page="settings"><span data-icon="settings"></span>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <a href="#learn/after-a-scan/if-danger-found.md" class="help-link"><span data-icon="alert"></span>I think I'm infected</a>
        <div class="local-badge" title="The dashboard is served from 127.0.0.1 and talks to nothing else"><span data-icon="lock"></span>Local only · no account · no tracking</div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="offline" id="offline" hidden>
        <strong>The dashboard has stopped.</strong> Open it again from your app icon or with <code>python3 app/dashboard.py</code>.
      </div>
      <section class="page" id="page-overview">
        <div class="loading" role="status"><span class="loading-spinner"></span>Checking your protection…</div>
      </section>
      <section class="page" id="page-todo" hidden></section>
      <section class="page" id="page-scan" hidden></section>
      <section class="page" id="page-protection" hidden></section>
      <section class="page" id="page-reports" hidden></section>
      <section class="page" id="page-learn" hidden></section>
      <section class="page" id="page-settings" hidden></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
