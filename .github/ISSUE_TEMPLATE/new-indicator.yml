name: New malicious package or indicator
description: A package, file name, marker, server or wallet the kit should detect
labels: [indicator]
body:
  - type: textarea
    id: what
    attributes:
      label: What should be detected?
      description: Package name(s), file name, marker string, domain/IP, or SHA-256. Never upload real malware.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public report / source
      description: Link to the research, advisory or registry page that confirms it.
    validations:
      required: true
